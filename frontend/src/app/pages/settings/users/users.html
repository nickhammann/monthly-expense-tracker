<p-table
  [value]="(users$ | async) ?? []"
  dataKey="id"
  editMode="row"
>
  <ng-template pTemplate="header">
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Monthly Report</th>
      <th>Enabled by Admin</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template
    pTemplate="body"
    let-user
    let-editing="editing"
    let-ri="rowIndex"
  >
    <tr [pEditableRow]="user">
      <td>
        <p-cellEditor>
          <ng-template pTemplate="input">
            <input
              pInputText
              [(ngModel)]="user.firstName"
            />
          </ng-template>

          <ng-template pTemplate="output">
            {{ user.firstName }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td>
        <p-cellEditor>
          <ng-template pTemplate="input">
            <input
              pInputText
              [(ngModel)]="user.lastName"
            />
          </ng-template>

          <ng-template pTemplate="output">
            {{ user.lastName }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td>
        <p-cellEditor>
          <ng-template pTemplate="input">
            <input
              pInputText
              [(ngModel)]="user.email"
            />
          </ng-template>

          <ng-template pTemplate="output">
            {{ user.email }}
          </ng-template>
        </p-cellEditor>
      </td>

      <td>
        <p-toggleSwitch
          [(ngModel)]="user.monthlyEmailRequested"
        />
      </td>

      <td>
        <p-toggleSwitch
          [(ngModel)]="user.monthlyEmailEnabled"
        />
      </td>

      <td>
        <div class="user-actions">
          @if (!editing) {
            <button
              pButton
              pInitEditableRow
              icon="pi pi-pencil"
              severity="secondary"
              text
              (click)="onEditInit(user)"
            ></button>
          }

          @if (editing) {
            <button
              pButton
              pSaveEditableRow
              icon="pi pi-check"
              text
              (click)="onEditSave(user)"
            ></button>

            <button
              pButton
              pCancelEditableRow
              icon="pi pi-times"
              severity="secondary"
              text
              (click)="onEditCancel(user)"
            ></button>
          }

          <button
            pButton
            icon="pi pi-trash"
            severity="danger"
            text
            (click)="onDelete(user)"
          ></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
